<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Autorisation - Posty78</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='2' fill='%23141414' stroke='%2300cc44' stroke-width='1.5'/%3E%3Cline x1='10' y1='9' x2='22' y2='9' stroke='%238a8a8a' stroke-width='1.4'/%3E%3Cline x1='10' y1='13' x2='22' y2='13' stroke='%238a8a8a' stroke-width='1.4'/%3E%3Cline x1='10' y1='17' x2='17' y2='17' stroke='%238a8a8a' stroke-width='1.4'/%3E%3Ccircle cx='22' cy='23' r='7' fill='%2300cc44'/%3E%3Cpath d='M18.7 23l2.3 2.3 4-4.3' fill='none' stroke='%23031a0a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --green:#00cc44;
    --green-dark:#00a838;
    --bg:#0a0a0a;
    --card:#141414;
    --text:#f5f5f5;
    --muted:#8a8a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    overflow:hidden;
  }
  .etape-tag{
    position:fixed;
    top:14px;
    right:14px;
    font-size:11px;
    color:var(--muted);
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    padding:6px 10px;
    border-radius:20px;
    user-select:none;
  }
  main{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .badge{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--bg);
    background:var(--green);
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:22px;
  }
  .consent-text{
    font-size:19px;
    line-height:1.5;
    color:var(--text);
    margin:0 0 34px;
  }
  .consent-text strong{color:var(--green);}
  button#authorizeBtn{
    width:100%;
    padding:22px;
    font-size:22px;
    font-weight:800;
    letter-spacing:0.03em;
    color:#031a0a;
    background:var(--green);
    border:none;
    border-radius:16px;
    cursor:pointer;
    transition:transform .08s ease, background .2s ease;
  }
  button#authorizeBtn:active{transform:scale(0.97); background:var(--green-dark);}
  button#authorizeBtn:disabled{opacity:0.5; cursor:default; transform:none;}
  .details-link{
    display:inline-block;
    margin-top:22px;
    font-size:12px;
    color:var(--muted);
    text-decoration:underline;
  }
  .status{
    min-height:20px;
    margin-top:14px;
    font-size:14px;
    color:var(--green);
    font-weight:600;
  }
  .check-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .check-overlay.show{opacity:1; pointer-events:all;}
  .check-overlay svg{width:84px;height:84px;margin-bottom:16px;}
  .check-overlay p{font-size:18px;font-weight:700;color:var(--text);margin:0;}
</style>
</head>
<body>

<div class="etape-tag" id="etapeTag">#-</div>

<main>
  <div class="badge">18+</div>
  <p class="consent-text">
    J'autorise <strong>Posty78</strong> à filmer et utiliser mon image et ma voix dans ses lives, vidéos, réseaux sociaux et contenus promotionnels, pendant <strong>10 ans</strong>.
  </p>
  <button id="authorizeBtn">J'AUTORISE</button>
  <div class="status" id="statusMsg"></div>
  <a href="details.html" class="details-link">Détails &amp; droits</a>
</main>

<div class="check-overlay" id="checkOverlay">
  <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="25" fill="none" stroke="#00cc44" stroke-width="2"/><path fill="none" stroke="#00cc44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M14 27l7 7 17-17"/></svg>
  <p>Enregistré</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ À REMPLACER par la config exacte de ton projet Firebase "posty78-maps"
  const firebaseConfig = {
    apiKey: "AIzaSyAMpcR8oV6kCDPHwoPiCZky8JriA9TiRuc",
    authDomain: "posty78-maps.firebaseapp.com",
    projectId: "posty78-maps",
    storageBucket: "posty78-maps.firebasestorage.app",
    messagingSenderId: "264681377127",
    appId: "1:264681377127:web:59cc8c638a03c0ef9cb3c2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Permet d'enregistrer même sans réseau (McDo perdu) : la preuve part dès que le tel retrouve du signal
  enableIndexedDbPersistence(db).catch(() => {});

  const VERSION_TEXTE = "v1-2026-08-12";
  const btn = document.getElementById("authorizeBtn");
  const statusMsg = document.getElementById("statusMsg");
  const etapeTag = document.getElementById("etapeTag");
  const checkOverlay = document.getElementById("checkOverlay");

  // --- Gestion de l'étape/compteur (numéro du McDo en cours) ---
  const ETAPE_KEY = "posty78_etape";
  function getEtape(){
    return parseInt(localStorage.getItem(ETAPE_KEY) || "1", 10);
  }
  function setEtape(n){
    localStorage.setItem(ETAPE_KEY, String(n));
    etapeTag.textContent = "#" + n;
  }
  etapeTag.textContent = "#" + getEtape();
  etapeTag.addEventListener("click", () => {
    const n = prompt("Numéro du McDo en cours :", getEtape());
    if (n !== null && !isNaN(parseInt(n, 10))) setEtape(parseInt(n, 10));
  });

  // --- Géolocalisation (demandée tôt, en silence, non bloquante) ---
  let lastCoords = null;
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => { lastCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude, precision: pos.coords.accuracy }; },
      () => { lastCoords = null; },
      { enableHighAccuracy: false, maximumAge: 60000, timeout: 8000 }
    );
  }

  // --- Clic "J'AUTORISE" ---
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    statusMsg.textContent = "";
    try {
      await addDoc(collection(db, "consentements"), {
        horodatage: serverTimestamp(),
        etape: getEtape(),
        geoloc: lastCoords,
        userAgent: navigator.userAgent,
        versionTexte: VERSION_TEXTE
      });
    } catch (e) {
      // Même en erreur réseau, addDoc avec la persistance offline résout normalement en local.
      console.error(e);
    }

    checkOverlay.classList.add("show");
    setTimeout(() => {
      checkOverlay.classList.remove("show");
      btn.disabled = false;
    }, 1400);
  });
</script>

</body>
</html>
